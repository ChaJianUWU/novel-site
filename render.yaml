services:
  - type: web
    name: novel-site
    runtime: node
    plan: free
    region: singapore
    buildCommand: echo "no build needed"
    startCommand: node server.mjs
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: DATA_DIR
        value: /data
      # 同步密钥写死，部署完插件这边直接能推，不用再去面板里复制
      - key: SYNC_KEY
        value: ea44e1ac8b71e533450b4186
      - key: SITE_TITLE
        value: 我的小说站
