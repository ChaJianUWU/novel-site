services:
  - type: web
    name: novel-site
    runtime: node
    plan: free
    region: singapore
    buildCommand: echo "no build needed"
    startCommand: node server.mjs
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: DATA_DIR
        value: /data
      # 同步密钥：第一次部署时自动生成，去 Render 面板的 Environment 里复制出来，
      # 填进 DSH 插件「站点设置 → 同步密钥」，以后就能一键推送。
      - key: SYNC_KEY
        generateValue: true
      - key: SITE_TITLE
        value: 我的小说站
